[package]
name = "ff"
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
description = "A small fuzzy finder for the terminal"
authors = ["jacbart"]
license = "MIT"
repository = "https://github.com/jacbart/ff"
keywords = ["fuzzy", "finder", "tui", "terminal"]
categories = ["command-line-utilities"]
build = "build.rs"

[dependencies]
# Optional so that embedders can pick what they pay for. The binary enables
# everything through the default `cli` feature, so its size is unaffected.
crossterm = { version = "0.29", features = ["use-dev-tty"], optional = true }
libc = { version = "0.2", optional = true }
tokio = { version = "1.0", optional = true }

[features]
default = ["cli"]
# The full binary: argument parsing, input sources and the interactive TUI.
cli = ["tui", "input", "tokio/rt-multi-thread", "tokio/macros"]
# Interactive terminal UI. Brings in crossterm.
tui = ["dep:crossterm", "tokio/rt", "tokio/sync"]
# File, directory, stdin, unix-socket and HTTP item sources.
input = [
  "dep:libc",
  "tokio/fs",
  "tokio/io-util",
  "tokio/net",
  "tokio/sync",
]

[dev-dependencies]
tempfile = "3.20"
# Tests need a runtime regardless of which features are enabled; the fuzzy
# matcher's tests are `#[tokio::test]` and `fuzzy` is always compiled.
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
vergen = { version = "9", features = ["build", "rustc"] }

[package.metadata.docs.rs]
all-features = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[[bin]]
name = "ff"
path = "src/bin/ff.rs"
required-features = ["cli"]

[lib]
name = "ff"
path = "src/lib.rs"
